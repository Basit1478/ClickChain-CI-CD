name: Build & Deploy to ECS (UAT)
on:
  push:
    branches:
      - uat

jobs:
  uat:
    runs-on: ubuntu-latest
    steps:
      # ----------------------------
      # Checkout Code
      # ----------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------
      # Set up Python 3.12
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ----------------------------
      # Install Dependencies
      # ----------------------------
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # ----------------------------
      # Run Tests (stops on failure)
      # ----------------------------
      - name: Run Tests
        run: pytest tests/ -v

      # ----------------------------
      # Build Package (ZIP artifact)
      # ----------------------------
      - name: Build Package
        run: zip -r clickchain-app.zip . -x "*.git*" -x "__pycache__/*" -x "*.pyc"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickchain-app
          path: clickchain-app.zip

      # ----------------------------
      # Setup SSH Key
      # ----------------------------
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ----------------------------
      # Deploy ZIP to EC2
      # ----------------------------
      - name: Deploy to EC2
        run: |
          scp -i ~/.ssh/ec2_key clickchain-app.zip ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/app/

      # ----------------------------
      # Unzip & Restart Gunicorn
      # ----------------------------
      - name: Restart App on EC2
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /opt/app &&
            unzip -o clickchain-app.zip &&
            pip install -r requirements.txt &&
            sudo systemctl restart gunicorn
          "
